name: autograding

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Student Code
        uses: actions/checkout@v4.2.2

      - name: Check answers.sql
        run: |
          if [ ! -f answers.sql ]; then
            echo "ERROR: answers.sql not found."
            echo "Please submit your PL/SQL program as answers.sql"
            exit 1
          fi

      - name: Start Oracle Database
        run: |
          echo "Setting up Oracle Database environment..."

      - name: Run Test Script
        run: |
          echo "Testing PL/SQL output..."
          # Execute SQL script check
          grep -i "DECLARE" answers.sql || (echo "Missing DECLARE block" && exit 1)
          grep -i "DBMS_OUTPUT" answers.sql || (echo "Missing DBMS_OUTPUT statement" && exit 1)

      - name: Complete Autograding
        run: |
          echo "Autograding successfully passed!"
